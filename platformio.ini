# ============================================================
# Interactive Audio Player — PlatformIO config
# Two build environments, one per NFC reader:
#
#   pio run -e teensy41_mfrc522    ← WS1850S (M5Stack RFID2, I2C 0x28)
#   pio run -e teensy41_pn532      ← PN532 (longer range, I2C 0x24)
#
# Upload:
#   pio run -e teensy41_pn532 --target upload
# ============================================================

[common]
platform = teensy
board    = teensy41
framework = arduino
monitor_speed = 115200

build_flags =
    -DAUDIO_BLOCK_SAMPLES=128

lib_deps_common =
    bblanchon/ArduinoJson @ ^7.0.0
    fastled/FastLED @ ^3.6.0

# ── WS1850S / MFRC522 (default) ──────────────────────────────
[env:teensy41_mfrc522]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags   = ${common.build_flags}
lib_deps =
    ${common.lib_deps_common}
    https://github.com/arozcan/MFRC522-I2C-Library.git

# ── PN532 (longer range) ─────────────────────────────────────
[env:teensy41_pn532]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -DUSE_PN532
    -DNFC_INTERFACE_I2C    ; required by Seeed PN532 library
lib_deps =
    ${common.lib_deps_common}
    https://github.com/Seeed-Studio/PN532.git