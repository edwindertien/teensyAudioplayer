[env:body_bridge]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.flash_size  = 4MB
board_build.partitions  = default.csv
board_upload.flash_size = 4MB

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    fastled/FastLED @ ^3.6.0